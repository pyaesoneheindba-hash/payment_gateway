brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
namesrvAddr=rmqnamesrv:9876
# Test-only: Proxy and Broker run in the same container; advertise host-loopback to the Windows JVM.
brokerIP1=127.0.0.1
autoCreateTopicEnable=false
# Ephemeral writable storage; no named volume and no contact with dev broker.
storePathRootDir=/tmp/rocketmq-it-store
storePathCommitLog=/tmp/rocketmq-it-store/commitlog
