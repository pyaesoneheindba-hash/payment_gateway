# Standalone Stage 7.3B1 Gateway test, intentionally not application.yml
spring.application.name=stage7-live-gateway-test
spring.main.web-application-type=reactive
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration
management.endpoints.enabled-by-default=false
payment.security.client-signature.enabled=true
server.address=127.0.0.1
server.port=0
