server:
  port: 8081

spring:
  application:
    name: payment-api-service
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_HTTP_NAMESPACE:}
        group: ${NACOS_HTTP_GROUP:DEFAULT_GROUP}
        service: ${spring.application.name}
        register-enabled: true
        enabled: true
        ip: ${NACOS_DISCOVERY_IP:}
        cluster-name: ${NACOS_HTTP_CLUSTER:DEFAULT}
        metadata:
          protocol: http
          management-path: /actuator
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://127.0.0.1:5432/payment_gateway}
    username: ${PAYMENT_DB_USER:payment}
    password: ${PAYMENT_DB_PASSWORD:payment}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

dubbo:
  application:
    name: payment-api-service
    protocol: tri
  protocol:
    name: tri
    port: -1
  registry:
    address: nacos://${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    register-mode: all
    use-as-config-center: false
    use-as-metadata-center: false
    parameters:
      namespace: ${NACOS_NAMESPACE:public}
  consumer:
    check: false
    protocol: tri

management:
  endpoints:
    web:
      exposure:
        include: health,info,nacosdiscovery
  endpoint:
    health:
      probes:
        enabled: true

payment:
  portal-live:
    enabled: ${PORTAL_LIVE_ENABLED:false}
    redis-channel: ${PORTAL_LIVE_REDIS_CHANNEL:txnhub.portal.payment-events}
    sse-timeout-ms: ${PORTAL_LIVE_SSE_TIMEOUT_MS:1800000}
    heartbeat-ms: ${PORTAL_LIVE_HEARTBEAT_MS:15000}
  redirect:
    registration:
      # Production default is HTTPS and non-localhost. Relax only in isolated local development.
      allow-http: ${REDIRECT_REGISTRATION_ALLOW_HTTP:false}
      allow-localhost: ${REDIRECT_REGISTRATION_ALLOW_LOCALHOST:false}
  public-status:
    poll-interval-ms: ${PUBLIC_STATUS_POLL_INTERVAL_MS:3000}
    sse-timeout-ms: ${PUBLIC_STATUS_SSE_TIMEOUT_MS:900000}
  webhook:
    registration:
      # Production default is HTTPS only. Enable HTTP only for isolated local testing.
      allow-http: ${WEBHOOK_REGISTRATION_ALLOW_HTTP:false}
      allow-private-addresses: ${WEBHOOK_REGISTRATION_ALLOW_PRIVATE_ADDRESSES:false}

  checkout:
    public-base-url: ${CHECKOUT_PUBLIC_BASE_URL:http://127.0.0.1:4200}
    ttl-seconds: ${CHECKOUT_TTL_SECONDS:300}
    expiry-scan-ms: ${CHECKOUT_EXPIRY_SCAN_MS:5000}
  identity:
    keycloak:
      # Used only for admin-driven merchant portal user provisioning. The client
      # must be a least-privilege Keycloak service account, never the bootstrap admin.
      admin-base-url: ${PORTAL_IDENTITY_KEYCLOAK_ADMIN_BASE_URL:http://127.0.0.1:8180}
      realm: ${PORTAL_IDENTITY_KEYCLOAK_REALM:payment-gateway}
      client-id: ${PORTAL_IDENTITY_KEYCLOAK_CLIENT_ID:payment-gateway-user-admin}
      client-secret: ${PORTAL_IDENTITY_KEYCLOAK_CLIENT_SECRET:}
